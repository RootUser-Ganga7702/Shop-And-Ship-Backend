name: Build → Push to ECR → Deploy to ECS

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Select config based on branch (ECR + ECS)
        run: |
          echo "Branch: $GITHUB_REF_NAME"

          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "ECR_REPOSITORY=${{ secrets.ECR_DEV_REPO }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_DEV }}" >> $GITHUB_ENV
            echo "TASKDEF_TEMPLATE=infra/taskdef-dev.json" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend" >> $GITHUB_ENV

          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "ECR_REPOSITORY=${{ secrets.ECR_PROD_REPO }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_PROD }}" >> $GITHUB_ENV
            echo "TASKDEF_TEMPLATE=infra/taskdef-prod.json" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend-prod" >> $GITHUB_ENV

          else
            echo "❌ Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build and push Docker image (SHA only - immutable safe)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "❌ ERROR: ECR_REPOSITORY is empty. Check GitHub secrets."
            exit 1
          fi

          ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "ECR_REPOSITORY=$ECR_REPOSITORY"
          echo "Building image: $IMAGE_URI"

          # Build from backend folder
          docker build -t $IMAGE_URI -f backend/Dockerfile backend

          echo "Pushing image to ECR..."
          docker push $IMAGE_URI

          echo "✅ Image pushed successfully:"
          echo "IMAGE_URI=$IMAGE_URI"

          # Export image uri for next steps
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Render ECS task definition (inject new image)
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASKDEF_TEMPLATE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
